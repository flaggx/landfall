version: 2

project_name: landfall

before:
  hooks:
    - go mod tidy

builds:
  - id: landfall
    main: ./cmd/landfall
    binary: landfall
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/flaggx/landfall/internal/cli.Version={{.Version}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^merge"
      - "^Merge"

release:
  github:
    owner: flaggx
    name: landfall
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
